name: skillbridge-database

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillbridge -d skillbridge']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - skillbridge_postgres_data:/var/lib/postgresql

  postgres-test:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: skillbridge_test
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillbridge -d skillbridge_test']
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql

volumes:
  skillbridge_postgres_data:
