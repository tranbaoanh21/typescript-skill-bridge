name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Validate OpenAPI contract
        run: npm run openapi:check

      - name: Test
        run: npm test

      - name: Enforce coverage floors
        run: npm run test:coverage

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Build
        run: npm run build

  database:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      DATABASE_URL: postgresql://skillbridge:skillbridge@localhost:5432/skillbridge_test
      DATABASE_DIRECT_URL: postgresql://skillbridge:skillbridge@localhost:5432/skillbridge_test
      E2E_DATABASE_URL: postgresql://skillbridge:skillbridge@localhost:5432/skillbridge_test
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://skillbridge:skillbridge@localhost:5672/skillbridge
      TEST_DATABASE_URL: postgresql://skillbridge:skillbridge@localhost:5432/skillbridge_test
      TURBO_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge -d skillbridge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_PASS: skillbridge
          RABBITMQ_DEFAULT_USER: skillbridge
          RABBITMQ_DEFAULT_VHOST: skillbridge
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify idempotent seed
        run: npm run db:seed && npm run db:seed

      - name: Test database, authentication, and core domain
        run: npm run test:integration

      - name: Run Postman collection with Newman
        run: npm run postman:test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical browser journeys
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://skillbridge:skillbridge@127.0.0.1:5432/skillbridge_test
      RABBITMQ_URL: amqp://skillbridge:skillbridge@127.0.0.1:5672/skillbridge
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: skillbridge_test
          POSTGRES_USER: skillbridge
          POSTGRES_PASSWORD: skillbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillbridge -d skillbridge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_PASS: skillbridge
          RABBITMQ_DEFAULT_USER: skillbridge
          RABBITMQ_DEFAULT_VHOST: skillbridge
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build production API image
        run: docker build --target runtime --file infrastructure/docker/Dockerfile.api --tag skillbridge-api:ci .

      - name: Build production worker image
        run: docker build --target worker-runtime --file infrastructure/docker/Dockerfile.api --tag skillbridge-worker:ci .

      - name: Verify production-only non-root runtime
        run: |
          test "$(docker image inspect skillbridge-api:ci --format '{{.Config.User}}')" = "node"
          docker run --rm skillbridge-api:ci node -e "for (const dependency of ['typescript', 'vitest', 'newman']) { try { require.resolve(dependency); process.exit(1); } catch {} }"
          test "$(docker image inspect skillbridge-worker:ci --format '{{.Config.User}}')" = "node"
          docker run --rm skillbridge-worker:ci node -e "for (const dependency of ['typescript', 'vitest', 'newman']) { try { require.resolve(dependency); process.exit(1); } catch {} }"

      - name: Apply migrations from immutable image
        run: docker run --rm --network host --env DATABASE_URL skillbridge-api:ci node packages/database/dist/cli/migrate.js

      - name: Start API image
        run: |
          docker run --detach --network host --name skillbridge-api-ci \
            --env AUTH_TOKEN_AUDIENCE=skillbridge-ci-clients \
            --env AUTH_TOKEN_ISSUER=skillbridge-ci \
            --env DATABASE_URL \
            --env ENABLE_API_DOCS=false \
            --env JWT_ACCESS_SECRET=ci-only-secret-with-at-least-thirty-two-characters \
            --env NODE_ENV=production \
            --env PORT=3000 \
            --env WEB_ORIGIN=http://localhost:4173 \
            skillbridge-api:ci

      - name: Start worker image
        run: |
          docker run --detach --network host --name skillbridge-worker-ci \
            --env DATABASE_URL \
            --env RABBITMQ_URL \
            --env WORKER_HEALTH_PORT=3001 \
            skillbridge-worker:ci

      - name: Wait for container readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs skillbridge-api-ci
          exit 1

      - name: Wait for worker readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs skillbridge-worker-ci
          exit 1

      - name: Show API logs on failure
        if: failure()
        run: docker logs skillbridge-api-ci

      - name: Show worker logs on failure
        if: failure()
        run: docker logs skillbridge-worker-ci
